<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
  </defs>
  <rect width="1100" height="620" fill="#ffffff"/>
  <text x="24" y="34" font-size="20" font-weight="700" fill="#111827">Turn: architecture</text>

  <!-- Restaurant -->
  <rect x="20" y="56" width="700" height="544" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="36" y="80" font-weight="700" fill="#334155">In the restaurant: one PC, Java 25 + Spring Boot</text>

  <rect x="40" y="100" width="140" height="70" rx="10" fill="#fff" stroke="#94a3b8"/>
  <text x="110" y="128" text-anchor="middle" font-weight="600">Camera</text>
  <text x="110" y="148" text-anchor="middle" fill="#64748b" font-size="12">webcam or CCTV / clip</text>

  <rect x="220" y="96" width="250" height="210" rx="10" fill="#eef2ff" stroke="#6366f1"/>
  <text x="345" y="120" text-anchor="middle" font-weight="700" fill="#3730a3">VisionService (OpenCV 5)</text>
  <text x="236" y="146" fill="#1e1b4b" font-size="13">dnn: YOLOX-S / NanoDet → people</text>
  <text x="236" y="170" fill="#1e1b4b" font-size="13">objdetect: ArUco → staff badges,</text>
  <text x="236" y="188" fill="#1e1b4b" font-size="13">   HELP / CHECK table cards</text>
  <text x="236" y="212" fill="#1e1b4b" font-size="13">zones → guests + staff per table</text>
  <text x="236" y="236" fill="#1e1b4b" font-size="13">FaceDetectorYN (YuNet) → face blur</text>
  <text x="236" y="260" fill="#1e1b4b" font-size="13">detect thread + MJPEG preview</text>
  <text x="236" y="288" fill="#64748b" font-size="12">frames stay in memory, never saved</text>

  <rect x="510" y="96" width="190" height="210" rx="10" fill="#ecfdf5" stroke="#10b981"/>
  <text x="605" y="120" text-anchor="middle" font-weight="700" fill="#065f46">FloorEngine</text>
  <text x="524" y="146" font-size="13">table state machine</text>
  <text x="524" y="168" font-size="13">alerts + routing to servers</text>
  <text x="524" y="190" font-size="13">rotation: next party</text>
  <text x="524" y="212" font-size="13">waitlist, reservations,</text>
  <text x="524" y="230" font-size="13">  blocks, wait simulation</text>
  <text x="524" y="254" font-size="13">Shift flow + next actions</text>
  <text x="524" y="280" fill="#64748b" font-size="12">per table, never per person</text>

  <rect x="220" y="350" width="250" height="122" rx="10" fill="#fff" stroke="#94a3b8"/>
  <text x="345" y="376" text-anchor="middle" font-weight="700">Web (Spring MVC)</text>
  <text x="236" y="400" font-size="13">/floor  map, rotation, host stand</text>
  <text x="236" y="420" font-size="13">/flow   owner's shift flow</text>
  <text x="236" y="440" font-size="13">/wait   guest page, local Wi-Fi</text>
  <text x="236" y="462" fill="#64748b" font-size="12">/api/health for monitoring</text>

  <rect x="510" y="350" width="190" height="122" rx="10" fill="#fff7ed" stroke="#f97316"/>
  <text x="605" y="376" text-anchor="middle" font-weight="700" fill="#9a3412">CloudSync</text>
  <text x="524" y="400" font-size="13">every 10 s, AWS SDK v2</text>
  <text x="524" y="420" font-size="13">counts + estimates only</text>
  <text x="524" y="440" font-size="13">no frames, no names</text>

  <rect x="40" y="500" width="200" height="66" rx="10" fill="#fff" stroke="#94a3b8"/>
  <text x="140" y="526" text-anchor="middle" font-weight="600">Servers + host</text>
  <text x="140" y="546" text-anchor="middle" fill="#64748b" font-size="12">wear printed badges</text>

  <rect x="290" y="500" width="180" height="66" rx="10" fill="#fff" stroke="#94a3b8"/>
  <text x="380" y="526" text-anchor="middle" font-weight="600">DemoSource</text>
  <text x="380" y="546" text-anchor="middle" fill="#64748b" font-size="12">scripted shift, no camera</text>

  <!-- AWS -->
  <rect x="760" y="56" width="320" height="544" rx="14" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="776" y="80" font-weight="700" fill="#92400e">AWS (us-east-1)</text>

  <rect x="840" y="96" width="180" height="62" rx="10" fill="#fff" stroke="#94a3b8"/>
  <text x="930" y="122" text-anchor="middle" font-weight="600">Guests and judges</text>
  <text x="930" y="142" text-anchor="middle" fill="#64748b" font-size="12">any phone or browser</text>

  <rect x="790" y="218" width="260" height="150" rx="10" fill="#fff" stroke="#f59e0b"/>
  <text x="920" y="244" text-anchor="middle" font-weight="700">Amazon S3 bucket</text>
  <text x="806" y="268" font-size="13">public/  guest page + live board</text>
  <text x="806" y="290" font-size="13">public/demo/  hosted demo board</text>
  <text x="806" y="312" font-size="13">shifts/  private shift history</text>
  <text x="806" y="334" font-size="13">releases/turn.jar  private</text>
  <text x="806" y="358" fill="#64748b" font-size="12">public read on public/* only</text>

  <rect x="790" y="424" width="260" height="128" rx="10" fill="#fff" stroke="#f59e0b"/>
  <text x="920" y="450" text-anchor="middle" font-weight="700">EC2 hosted demo</text>
  <text x="806" y="474" font-size="13">CloudFormation: infra/turn-demo.yaml</text>
  <text x="806" y="496" font-size="13">Turn in demo mode, systemd, port 80</text>
  <text x="806" y="518" font-size="13">IAM role: read jar, write demo board</text>
  <text x="806" y="540" fill="#64748b" font-size="12">no SSH; Session Manager; recovery alarm</text>

  <text x="806" y="584" fill="#64748b" font-size="12">PC key: write public/ and shifts/ only</text>

  <!-- arrows -->
  <path d="M180 135 H218" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <path d="M470 190 H508" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <text x="474" y="182" font-size="11" fill="#475569">obs.</text>
  <path d="M605 306 V348" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <path d="M560 306 C560 330 420 320 400 348" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M700 400 H745 V300 H788" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="708" y="392" font-size="11" fill="#475569">PutObject</text>
  <path d="M930 216 V160" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <text x="938" y="194" font-size="11" fill="#475569">HTTPS GET</text>
  <path d="M1062 488 H1070 V127 H1022" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="1006" y="412" font-size="11" fill="#475569" transform="rotate(-90 1066 300)">HTTP</text>
  <path d="M920 422 V370" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <path d="M240 533 C300 533 330 500 345 474" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M110 498 V172" stroke="#374151" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="118" y="340" font-size="11" fill="#475569">badges seen</text>
  <path d="M470 520 H490 V250 H508" stroke="#374151" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#a)"/>
</svg>
