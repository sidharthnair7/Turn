<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
  </defs>
  <rect width="1100" height="560" fill="#ffffff"/>
  <text x="24" y="34" font-size="20" font-weight="700" fill="#111827">Turn: architecture</text>

  <!-- Restaurant -->
  <rect x="20" y="56" width="700" height="484" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="36" y="80" font-weight="700" fill="#334155">In the restaurant: one laptop, Java 25 + Spring Boot</text>

  <rect x="40" y="100" width="140" height="70" rx="10" fill="#fff" stroke="#94a3b8"/>
  <text x="110" y="128" text-anchor="middle" font-weight="600">Camera</text>
  <text x="110" y="148" text-anchor="middle" fill="#64748b" font-size="12">webcam or CCTV / clip</text>

  <rect x="220" y="96" width="250" height="186" rx="10" fill="#eef2ff" stroke="#6366f1"/>
  <text x="345" y="120" text-anchor="middle" font-weight="700" fill="#3730a3">VisionService (OpenCV 5)</text>
  <text x="236" y="146" fill="#1e1b4b" font-size="13">dnn: YOLOX-S / NanoDet → people</text>
  <text x="236" y="170" fill="#1e1b4b" font-size="13">objdetect: ArUco → staff badges,</text>
  <text x="236" y="188" fill="#1e1b4b" font-size="13">   HELP / CHECK table cards</text>
  <text x="236" y="212" fill="#1e1b4b" font-size="13">zones → guests + staff per table</text>
  <text x="236" y="236" fill="#1e1b4b" font-size="13">FaceDetectorYN (YuNet) → face blur</text>
  <text x="236" y="262" fill="#64748b" font-size="12">frames stay in memory, never saved</text>

  <rect x="510" y="96" width="190" height="186" rx="10" fill="#ecfdf5" stroke="#10b981"/>
  <text x="605" y="120" text-anchor="middle" font-weight="700" fill="#065f46">FloorEngine</text>
  <text x="524" y="146" font-size="13">table state machine</text>
  <text x="524" y="168" font-size="13">alerts + routing to servers</text>
  <text x="524" y="190" font-size="13">waitlist + wait simulation</text>
  <text x="524" y="212" font-size="13">ShiftStats insights</text>
  <text x="524" y="236" fill="#64748b" font-size="12">(per table, never per person)</text>
  <text x="524" y="262" fill="#64748b" font-size="12">DemoSource can drive it too</text>

  <rect x="220" y="330" width="250" height="90" rx="10" fill="#fff" stroke="#94a3b8"/>
  <text x="345" y="356" text-anchor="middle" font-weight="700">Web (Spring MVC)</text>
  <text x="236" y="380" font-size="13">/floor  staff view + blurred camera</text>
  <text x="236" y="402" font-size="13">/wait   guest page on the local Wi-Fi</text>

  <rect x="510" y="330" width="190" height="90" rx="10" fill="#fff7ed" stroke="#f97316"/>
  <text x="605" y="356" text-anchor="middle" font-weight="700" fill="#9a3412">CloudSync</text>
  <text x="524" y="380" font-size="13">every 10 s, AWS SDK v2</text>
  <text x="524" y="402" font-size="13">counts + estimates only</text>

  <rect x="40" y="450" width="200" height="66" rx="10" fill="#fff" stroke="#94a3b8"/>
  <text x="140" y="476" text-anchor="middle" font-weight="600">Servers + host</text>
  <text x="140" y="496" text-anchor="middle" fill="#64748b" font-size="12">wear printed badges</text>

  <!-- AWS -->
  <rect x="760" y="56" width="320" height="484" rx="14" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="776" y="80" font-weight="700" fill="#92400e">AWS</text>
  <rect x="790" y="300" width="260" height="130" rx="10" fill="#fff" stroke="#f59e0b"/>
  <text x="920" y="326" text-anchor="middle" font-weight="700">Amazon S3 bucket</text>
  <text x="806" y="352" font-size="13">public/index.html  guest page</text>
  <text x="806" y="374" font-size="13">public/wait.json   live board</text>
  <text x="806" y="396" font-size="13">shifts/DATE.json   private</text>
  <text x="806" y="418" fill="#64748b" font-size="12">public read on public/* only</text>

  <rect x="840" y="110" width="180" height="70" rx="10" fill="#fff" stroke="#94a3b8"/>
  <text x="930" y="138" text-anchor="middle" font-weight="600">Guests' phones</text>
  <text x="930" y="158" text-anchor="middle" fill="#64748b" font-size="12">anywhere, any network</text>

  <!-- arrows -->
  <path d="M180 135 H218" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <path d="M470 180 H508" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  
  <path d="M605 282 V328" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <path d="M560 282 C560 310 420 300 400 328" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M700 375 H788" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <text x="712" y="366" font-size="11" fill="#475569">PutObject</text>
  <path d="M930 298 V182" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <text x="938" y="246" font-size="11" fill="#475569">HTTPS GET</text>
  <path d="M240 470 C300 470 330 440 345 422" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M110 448 V172" stroke="#374151" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="118" y="320" font-size="11" fill="#475569">badges seen</text>
</svg>
