<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Turn · Wait</title>
  <script src="js/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap">
  <link rel="stylesheet" href="css/turn.css">
</head>
<body class="guest">
<div class="aurora" aria-hidden="true"></div>

<div class="guest-shell">
  <header class="guest-top rise">
    <a href="/" class="brand">Turn<span class="dot"></span></a>
    <button class="icon-btn" data-theme-toggle aria-label="Toggle dark mode">
      <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>

  <main class="guest-card">
    <p class="eyebrow rise" style="--d:.05s">Live wait</p>
    <h1 class="rise" style="--d:.1s">Your table, <em>in real time</em>.</h1>
    <p class="lead rise" style="--d:.15s">Wait time from what's actually happening on the floor.</p>

    <div class="field rise" style="--d:.2s">
      <span class="label" id="size-label">Party size</span>
      <div id="size-seg" class="seg" role="radiogroup" aria-labelledby="size-label"></div>
      <select id="size" hidden>
        <option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option><option>6</option>
      </select>
    </div>

    <section class="estimate rise" style="--d:.26s" aria-live="polite">
      <div id="estimate" class="big num">…</div>
      <div id="sub" class="sub"></div>
    </section>

    <div id="mine" class="mine" hidden aria-live="polite"></div>

    <form id="join" class="join rise" style="--d:.32s">
      <label class="field"><span class="label">Your name</span>
        <input id="name" maxlength="30" placeholder="So the host can call you" autocomplete="given-name" required></label>
      <button class="btn btn-rainbow" type="submit">Join the waitlist</button>
    </form>

    <p class="privacy rise" style="--d:.38s">Turn counts tables, never faces. Faces are blurred and no photos of you are saved or sent anywhere.</p>
    <p class="privacy demo-note" id="demo-note" hidden>Demo mode: the restaurant floor is simulated.</p>
  </main>
</div>
<script src="js/wait.js"></script>
</body>
</html>
