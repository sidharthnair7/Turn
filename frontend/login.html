<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Turn · Staff sign in</title>
  <script src="js/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap">
  <link rel="stylesheet" href="css/turn.css">
</head>
<body class="guest">
<div class="aurora" aria-hidden="true"></div>
<div class="guest-shell">
  <header class="guest-top rise">
    <a href="/" class="brand">Turn<span class="dot"></span></a>
    <button class="icon-btn" data-theme-toggle aria-label="Toggle dark mode">
      <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>
  <main class="guest-card">
    <p class="eyebrow rise" style="--d:.05s">Staff only</p>
    <h1 class="rise" style="--d:.1s">The floor, <em>for your team</em>.</h1>
    <p class="lead rise" style="--d:.15s">Enter the staff PIN to open the floor, the camera view and the host stand. Guests can still use the wait page.</p>
    <form id="login" class="join rise" style="--d:.2s">
      <label class="field"><span class="label">Staff PIN</span>
        <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" required></label>
      <button class="btn btn-rainbow" type="submit">Open the floor</button>
      <p id="err" class="privacy" role="alert" hidden>That PIN didn't work.</p>
    </form>
  </main>
</div>
<script>
  document.getElementById("login").addEventListener("submit", async (e) => {
    e.preventDefault();
    const res = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ pin: document.getElementById("pin").value }) });
    if (res.ok) {
      const next = new URLSearchParams(location.search).get("next");
      location.href = next && next.startsWith("/") && !next.startsWith("//") ? next : "/floor";
    } else {
      document.getElementById("err").hidden = false;
    }
  });
</script>
</body>
</html>
