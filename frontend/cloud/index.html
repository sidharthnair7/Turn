<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turn · Wait time</title>
<!-- Served from S3. Reads wait.json, which the restaurant's Turn box publishes every few seconds. -->
<style>
  :root { --bg:#f7f7f5; --card:#fff; --ink:#16181d; --muted:#6b7280; --line:#e5e7eb; --accent:#2f6df6; --ok:#12a150; --warn:#c2410c; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px; background:var(--bg); color:var(--ink);
         font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { width:100%; max-width:420px; background:var(--card); border:1px solid var(--line); border-radius:20px; padding:28px; }
  h1 { margin:0 0 4px; font-size:14px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
  .sizes { display:flex; gap:6px; margin:18px 0 22px; }
  .sizes button { flex:1; padding:10px 0; border:1px solid var(--line); background:#fff; border-radius:10px; font:inherit; cursor:pointer; }
  .sizes button[aria-pressed=true] { background:var(--ink); color:#fff; border-color:var(--ink); }
  .eta { font-size:64px; font-weight:700; line-height:1; font-variant-numeric:tabular-nums; }
  .eta small { font-size:20px; font-weight:500; color:var(--muted); margin-left:6px; }
  .eta.free { font-size:28px; color:var(--ok); }
  .eta.none { font-size:22px; color:var(--warn); }
  p { color:var(--muted); margin:10px 0 0; }
  .meta { margin-top:22px; padding-top:14px; border-top:1px solid var(--line); font-size:13px; color:var(--muted); }
  .stale .eta { opacity:.4; }
</style>
</head>
<body>
<main>
  <h1>Wait time · party of</h1>
  <div class="sizes" id="sizes"></div>
  <div class="eta" id="eta">…</div>
  <p id="sub">Checking the tables…</p>
  <div class="meta" id="meta"></div>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  let board = null, size = "2";

  function draw() {
    if (!board) return;
    const sizes = Object.keys(board.etaMinBySize);
    $("sizes").innerHTML = sizes.map((s) => `<button type="button" data-s="${s}" aria-pressed="${s === size}">${s}</button>`).join("");
    const eta = board.etaMinBySize[size];
    const el = $("eta");
    if (eta === null || eta === undefined) {
      el.className = "eta none"; el.textContent = "No table fits that size";
      $("sub").textContent = "Ask the host. They may be able to join tables.";
    } else if (eta === 0) {
      el.className = "eta free"; el.textContent = "A table is free now";
      $("sub").textContent = "Head to the host stand.";
    } else {
      el.className = "eta"; el.innerHTML = `${eta}<small>min</small>`;
      $("sub").textContent = `Based on the tables right now. ${board.waiting} part${board.waiting === 1 ? "y" : "ies"} on the list.`;
    }
    const age = Math.round((Date.now() - Date.parse(board.updatedAt)) / 1000);
    document.body.classList.toggle("stale", age > 60);
    $("meta").textContent = (age > 60 ? "Not updated for a while. " : `Updated ${age}s ago. `) +
      (board.source === "DEMO" ? "Demo restaurant." : "Live from the floor.");
  }

  $("sizes").addEventListener("click", (e) => {
    const b = e.target.closest("[data-s]");
    if (b) { size = b.dataset.s; draw(); }
  });

  async function refresh() {
    try {
      board = await (await fetch("wait.json?t=" + Date.now(), { cache: "no-store" })).json();
    } catch (e) { /* keep the last board, it shows as stale */ }
    draw();
  }
  refresh();
  setInterval(refresh, 5000);
</script>
</body>
</html>
