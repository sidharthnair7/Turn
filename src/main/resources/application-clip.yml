# Runs Turn's real vision pipeline on OpenCV's own sample clip (people walking, 768x576),
# to show the camera path working without a staged restaurant:
#   mvnw spring-boot:run -Dspring-boot.run.profiles=clip
# The "tables" here are just patches of pavement people walk through, so expect seat/leave churn.
turn:
  source: file:lib/samples/vtest.avi
  tables:
    - { number: 1, name: "Zone A", seats: 4, x: 300, y: 180, w: 200, h: 160 }
    - { number: 2, name: "Zone B", seats: 4, x: 520, y: 200, w: 200, h: 160 }
